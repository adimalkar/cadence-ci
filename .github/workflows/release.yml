name: Release

# Tag-triggered only, so it stays dormant until there is something to release.
#
# MANUAL PREREQUISITE, ONE TIME: PyPI Trusted Publishing must be configured before the
# first tag, at https://pypi.org/manage/account/publishing/ --
#   project: cadence · owner: adimalkar · repo: cadence-ci
#   workflow: release.yml · environment: pypi
# Until that exists the publish step will fail by design. No API token is stored anywhere:
# the runner exchanges a short-lived OIDC identity for an upload credential, so there is no
# long-lived secret in this repo to leak. That is the point.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Re-run the full gate against the exact tagged commit. A tag can point anywhere, and
  # "CI was green on main last week" is not a claim about this artifact.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cadence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      UV_FROZEN: "1"
      CADENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cadence_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache on the release path. A cache entry poisoned by an earlier run could
      # influence the artifact that gets published to PyPI; a release must come from the
      # lockfile alone. Slower, and correct.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Full suite, no skips tolerated
        run: |
          set -o pipefail
          uv run pytest -q -rs 2>&1 | tee pytest.out
          grep -qE '[0-9]+ skipped' pytest.out && { echo "::error::tests skipped in a release build"; exit 1; }
          echo "suite green"

      - name: The tag must match the packaged version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache on the release path. A cache entry poisoned by an earlier run could
      # influence the artifact that gets published to PyPI; a release must come from the
      # lockfile alone. Slower, and correct.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Smoke-test the artifact that will actually be published
        run: |
          set -euo pipefail
          uv venv /tmp/rc
          VIRTUAL_ENV=/tmp/rc uv pip install dist/*.whl
          /tmp/rc/bin/cadence --help > /dev/null
          echo "published artifact installs and runs"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi          # gate the credential behind an environment
    permissions:
      id-token: write          # OIDC for Trusted Publishing -- no stored API token
      attestations: write      # provenance, so a consumer can verify where this came from
      contents: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
