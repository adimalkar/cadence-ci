name: OpenSSF Scorecard

# Scores this repository's supply-chain posture against the OpenSSF checks: pinned
# dependencies, branch protection, token permissions, dangerous workflow patterns, and
# more. Results land in the Security tab.
#
# Publishing it is deliberate and matches the Phase 4 rule about the calibration
# dashboard -- publish whether or not it flatters us. Anyone evaluating an Apache-2.0
# tool that wants read access to their CI history can check our posture without asking.
on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish the signed result to the public dashboard
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
