version: 2

updates:
  # The Node 20 deprecation on checkout@v4 and setup-uv@v5 sat in the workflow until
  # a run surfaced it as a warning. This is the thing that would have opened that PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Patch and minor bumps arrive as one PR; majors stay separate so a breaking
      # change is never buried in a batch of routine updates.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
