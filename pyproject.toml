[project]
name = "cadence"
version = "0.1.0"
description = "Evidence-grounded CI intelligence. Reads your build history, tells you what it costs, opens the PR that fixes it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # round-trip mode carries line/col on every node, which is what `code_range`
    # evidence needs -- and Phase 2's comment-preserving fixers need the same loader.
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.11",
    "pytest-cov>=5.0",
    # Order-dependent tests are exactly the failure mode Phase 3 exists to diagnose.
    # Running our own suite shuffled keeps us honest -- it already caught one.
    "pytest-randomly>=3.15",
]

# CI-only tooling, kept out of `dev` so a local install stays lean. Pinned through the
# lockfile rather than resolved fresh in CI, which is the whole point of locking.
ci = [
    "pip-audit>=2.7",
    "zizmor>=1.0",
    "cyclonedx-bom>=4.5",
]

[project.scripts]
cadence = "cadence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Ratchet, not a blanket. Every module not listed below is type-checked in CI, so new
# code lands clean. These eight carry 25 pre-existing errors from before the checker
# existed -- annotation gaps, mostly Optional narrowing. Delete entries as they are
# fixed; do not add new ones. Two of the errors look like genuine defects rather than
# annotation noise and are tracked separately:
#   - evalsweep.py:75  CIProvider protocol is missing fetch_workflow_files
#   - github.py:203/368 created_at can be None but Run.created_at is non-optional
[[tool.mypy.overrides]]
module = [
    "cadence.audit",
    "cadence.dag",
    "cadence.evalsweep",
    "cadence.findings",
    "cadence.ingest",
    "cadence.models",
    "cadence.providers.github",
    "cadence.queue",
]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
